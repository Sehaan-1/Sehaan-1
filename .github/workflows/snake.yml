name: Generate contribution snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Sehaan-1
          outputs: |
            dist/github-snake.svg?color_snake=#C0392B&color_dots=#f8f2e2,#efdfb4,#dfc272,#c49a2c,#8f6b10
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF6B6B&color_dots=#171306,#332a0f,#5c4a16,#8a6f1d,#d9a92b

      - name: Speed up snake animation
        run: sudo sed -i -E 's/[0-9]+ms/26000ms/g' dist/*.svg

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
