name: Generate contribution snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Sehaan-1
          outputs: |
            dist/github-snake.svg?color_snake=#C0392B&color_dots=#eeeae2,#d8cbb8,#a7aa8c,#74806b,#4d5a4b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF6B6B&color_dots=#161b22,#4b5146,#626c59,#7b876e,#9aa184

      - name: Speed up snake animation and trim empty leading columns
        run: |
          sudo sed -i -E 's/[0-9]+ms/26000ms/g' dist/*.svg
          sudo python3 - <<'EOF'
          import glob, re
          for path in glob.glob('dist/*.svg'):
              svg = open(path, 'r', encoding='utf-8').read()
              active_xs = [float(x) for x in re.findall(r'<rect class="c c[^"]+" x="([^"]+)"', svg)]
              if active_xs:
                  start_x = max(2.0, min(active_xs) - 16.0)
                  vx = int(start_x - 18)
                  vw = 864 - vx
                  svg = re.sub(
                      r'<rect class="c" x="([^"]+)" y="[^"]+" rx="2" ry="2"/>',
                      lambda m: '' if float(m.group(1)) < start_x else m.group(0),
                      svg,
                  )
                  svg = re.sub(r'viewBox="[^"]+" width="\d+"', f'viewBox="{vx} -32 {vw} 192" width="{vw}"', svg, count=1)
              open(path, 'w', encoding='utf-8').write(svg)
          EOF

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
