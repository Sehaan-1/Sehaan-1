<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sehaan Ur Rahman — applied AI, machine learning systems, and data engineering">
  <title>Sehaan Ur Rahman</title>
  <defs>
    <linearGradient id="d-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="d-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#818CF8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="d-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="d-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0B0F14"/>
  <rect width="1200" height="300" fill="url(#d-grid)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#d-glow-a)"/>
  <circle cx="1130" cy="30" r="220" fill="url(#d-glow-b)"/>
  <rect width="1200" height="2.5" fill="url(#d-line)"/>

  <!-- aperture mark -->
  <g fill="none" stroke="url(#d-ring)" stroke-width="1">
    <circle cx="1010" cy="150" r="118" stroke-opacity="0.10"/>
    <circle cx="1010" cy="150" r="88" stroke-opacity="0.16"/>
    <circle cx="1010" cy="150" r="58" stroke-opacity="0.22"/>
    <circle cx="1010" cy="150" r="30" stroke-opacity="0.34"/>
    <circle cx="1010" cy="150" r="150" stroke-opacity="0.06" stroke-dasharray="2 10"/>
  </g>
  <g stroke="url(#d-ring)" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round">
    <path d="M1010 18v10"/><path d="M1010 272v10"/>
    <path d="M878 150h10"/><path d="M1132 150h10"/>
  </g>
  <circle cx="1010" cy="150" r="4" fill="#7DD3FC"/>
  <circle cx="1010" cy="150" r="10" fill="#7DD3FC" fill-opacity="0.16"/>

  <!-- identity -->
  <text x="72" y="143" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.4" fill="#F5F7FA">Sehaan Ur Rahman</text>

  <rect x="73" y="172" width="64" height="3" rx="1.5" fill="url(#d-accent)"/>

  <text x="72" y="207" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="17.5" letter-spacing="0.2" fill="#93A1B4">Applied AI · Machine learning systems · Data engineering</text>

  <text x="72" y="238" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="11" letter-spacing="2.6" fill="#7C8CA1" fill-opacity="0.72">BUILT TO RUN · MEASURED TO PROVE IT</text>

  <text x="1128" y="270" text-anchor="end"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="11" letter-spacing="1.4" fill="#8B98A9" fill-opacity="0.55">github.com/Sehaan-1</text>
