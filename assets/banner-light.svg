<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sehaan Ur Rahman — applied AI, machine learning systems, and data engineering">
  <title>Sehaan Ur Rahman</title>
  <defs>
    <linearGradient id="l-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="l-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#0891B2" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#4F46E5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="l-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="l-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0F172A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#FAFAF9"/>
  <rect width="1200" height="300" fill="url(#l-grid)"/>
  <circle cx="1010" cy="150" r="260" fill="url(#l-glow-a)"/>
  <circle cx="1130" cy="30" r="220" fill="url(#l-glow-b)"/>
  <rect width="1200" height="2.5" fill="url(#l-line)"/>

  <!-- aperture mark -->
  <g fill="none" stroke="url(#l-ring)" stroke-width="1">
    <circle cx="1010" cy="150" r="118" stroke-opacity="0.14"/>
    <circle cx="1010" cy="150" r="88" stroke-opacity="0.20"/>
    <circle cx="1010" cy="150" r="58" stroke-opacity="0.28"/>
    <circle cx="1010" cy="150" r="30" stroke-opacity="0.42"/>
    <circle cx="1010" cy="150" r="150" stroke-opacity="0.08" stroke-dasharray="2 10"/>
  </g>
  <g stroke="url(#l-ring)" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round">
    <path d="M1010 18v10"/><path d="M1010 272v10"/>
    <path d="M878 150h10"/><path d="M1132 150h10"/>
  </g>
  <circle cx="1010" cy="150" r="4" fill="#0891B2"/>
  <circle cx="1010" cy="150" r="10" fill="#0891B2" fill-opacity="0.14"/>

  <!-- identity -->
  <text x="72" y="143" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.4" fill="#0F172A">Sehaan Ur Rahman</text>

  <rect x="73" y="172" width="64" height="3" rx="1.5" fill="url(#l-accent)"/>

  <text x="72" y="207" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="17.5" letter-spacing="0.2" fill="#55637A">Applied AI · Machine learning systems · Data engineering</text>

  <text x="72" y="238" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="11" letter-spacing="2.6" fill="#5A687E" fill-opacity="0.95">EVALUATION-FIRST · FAILURE-AWARE · BUILT TO RUN</text>

  <text x="1128" y="270" text-anchor="end"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="11" letter-spacing="1.4" fill="#55637A" fill-opacity="0.85">github.com/Sehaan-1</text>
</svg>
